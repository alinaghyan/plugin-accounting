name: PHP checks

on:
  push:
    branches: ["main", "scaffold/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-sqlite-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - name: PHP syntax check
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
      - name: SQLite schema smoke test
        run: php tests/sqlite-schema-smoke.php
      - name: Purchase workflow integration smoke test
        run: php tests/purchase-workflow-smoke.php
      - name: Purchase settlement and return integration smoke test
        run: php tests/purchase-settlements-returns-smoke.php
